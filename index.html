<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HELIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#030712;--card:#0a0f1c;--border:#1a2744;--accent:#3b82f6;
  --tai:#10b981;--tai-g:rgba(16,185,129,.4);--xiu:#f43f5e;--xiu-g:rgba(244,63,94,.4);
  --txt:#f1f5f9;--muted:#64748b;--warn:#f59e0b;--r:16px;
}
html,body{touch-action:manipulation;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1280px;margin:0 auto;padding:12px}
header{background:rgba(10,15,28,.9);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:14px}
.logo-box{width:52px;height:52px;border-radius:14px;background:#050914;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain;display:none}
.logo-def{display:flex;align-items:center;justify-content:center}
.logo-def svg{width:28px;height:28px}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:.04em;background:linear-gradient(135deg,#fff,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub{font-size:.7rem;font-weight:700;color:#38bdf8;display:block;margin-top:1px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;justify-content:flex-end}
.inp{background:#050914;border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--txt);font-size:15px;outline:none;transition:.2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.inp-logo{min-width:200px;flex:1;max-width:320px}
.inp-key{width:150px}
.btn{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;padding:10px 20px;border-radius:12px;font-weight:800;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(37,99,235,.35);transition:.15s}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px}
.err{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);color:var(--xiu);padding:11px 14px;border-radius:14px;margin-bottom:14px;font-size:.82rem;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.card-h{display:flex;justify-content:space-between;align-items:center}
.card-h h2{font-size:1rem;font-weight:800}
.tag{font-size:.7rem;background:#0d182e;border:1px solid #1e335a;color:#93c5fd;padding:4px 10px;border-radius:8px;font-weight:700}
.pred-box{background:radial-gradient(circle at 50% 30%,#0d152b 0%,#060914 100%);border:1px solid #182845;border-radius:16px;padding:22px 14px;text-align:center}
.pred{font-size:3.6rem;font-weight:900;line-height:1;letter-spacing:-.03em;text-transform:uppercase}
.pred.tai{color:var(--tai);filter:drop-shadow(0 0 18px var(--tai-g))}
.pred.xiu{color:var(--xiu);filter:drop-shadow(0 0 18px var(--xiu-g))}
.meta{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px;font-size:.85rem;color:var(--muted)}
.badge{font-size:.65rem;font-weight:800;padding:3px 9px;border-radius:6px;background:#261805;color:var(--warn);border:1px solid #57390c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:#050914;border:1px solid #142035;border-radius:12px;padding:9px 4px;text-align:center}
.st .l{font-size:.65rem;color:var(--muted);text-transform:uppercase;font-weight:700}
.st .v{font-size:.9rem;font-weight:800;margin-top:2px}
.sec-t{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;margin-bottom:6px}
.scroll{max-height:160px;overflow-y:auto;border:1px solid #142035;border-radius:12px;background:#050914;padding:3px 0}
.scroll::-webkit-scrollbar{width:3px}
.scroll::-webkit-scrollbar-thumb{background:#1e3152;border-radius:2px}
.row{display:flex;align-items:center;padding:7px 11px;font-size:.75rem;border-bottom:1px solid #0c1526}
.row:last-child{border-bottom:none}
.dot{width:7px;height:7px;border-radius:50%;margin-right:9px;flex-shrink:0}
.dot.T{background:var(--tai);box-shadow:0 0 6px var(--tai)}
.dot.X{background:var(--xiu);box-shadow:0 0 6px var(--xiu)}
.ok{color:var(--tai);font-weight:800;background:rgba(16,185,129,.12);padding:2px 5px;border-radius:4px;margin-right:7px}
.ng{color:var(--xiu);font-weight:800;background:rgba(244,63,94,.12);padding:2px 5px;border-radius:4px;margin-right:7px}
footer{margin-top:20px;padding:14px;text-align:center;font-size:.72rem;color:var(--muted);border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo-box" id="box-logo">
        <div class="logo-def" id="logo-default">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <img id="logo-img" alt="">
      </div>
      <div>
        <h1>HELIX</h1>
        <span class="sub">Dev Anh Khôi</span>
      </div>
    </div>
    <div class="tools">
      <input type="text" id="logo-base64" class="inp inp-logo mono" placeholder="Base64 logo..." autocomplete="off">
      <input type="password" id="key" class="inp inp-key mono" placeholder="Key..." autocomplete="off">
      <button class="btn" id="btn-ketnoi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        KẾT NỐI
      </button>
    </div>
  </header>

  <div id="hop-loi" class="err"></div>

  <div class="grid" id="khu-vuc-lam-viec" style="display:none">
    <div class="card" id="the-hu">
      <div class="card-h">
        <h2>TRUYỀN THỐNG</h2>
        <span class="tag mono" id="hu-thuat-toan">—</span>
      </div>
      <div class="pred-box">
        <div class="pred" id="hu-du-doan">—</div>
        <div class="meta mono">
          <span>#<b id="hu-phien-tiep" style="color:var(--txt)">—</b></span>
          <span><b id="hu-tin-cay" style="color:var(--txt)">—</b>%</span>
          <span id="hu-co-bao" class="badge" style="display:none">ĐẢO</span>
        </div>
      </div>
      <div class="stats mono">
        <div class="st"><div class="l">Trước</div><div class="v" id="hu-phien-truoc">—</div></div>
        <div class="st"><div class="l">Xúc xắc</div><div class="v" id="hu-xuc-xac">—</div></div>
        <div class="st"><div class="l">Tổng</div><div class="v" id="hu-tong-diem">—</div></div>
        <div class="st"><div class="l">Trúng</div><div class="v" id="hu-ti-le">—</div></div>
      </div>
      <div>
        <div class="sec-t"><span>Kiểm định</span><span>30</span></div>
        <div class="scroll mono" id="hu-kiem-dinh"></div>
      </div>
      <div>
        <div class="sec-t"><span>Lịch sử</span><span>30</span></div>
        <div class="scroll mono" id="hu-lich-su"></div>
      </div>
    </div>

    <div class="card" id="the-md5">
      <div class="card-h">
        <h2>MD5</h2>
        <span class="tag mono" id="md5-thuat-toan">—</span>
      </div>
      <div class="pred-box">
        <div class="pred" id="md5-du-doan">—</div>
        <div class="meta mono">
          <span>#<b id="md5-phien-tiep" style="color:var(--txt)">—</b></span>
          <span><b id="md5-tin-cay" style="color:var(--txt)">—</b>%</span>
          <span id="md5-co-bao" class="badge" style="display:none">ĐẢO</span>
        </div>
      </div>
      <div class="stats mono">
        <div class="st"><div class="l">Trước</div><div class="v" id="md5-phien-truoc">—</div></div>
        <div class="st"><div class="l">Xúc xắc</div><div class="v" id="md5-xuc-xac">—</div></div>
        <div class="st"><div class="l">Tổng</div><div class="v" id="md5-tong-diem">—</div></div>
        <div class="st"><div class="l">Trúng</div><div class="v" id="md5-ti-le">—</div></div>
      </div>
      <div>
        <div class="sec-t"><span>Kiểm định</span><span>30</span></div>
        <div class="scroll mono" id="md5-kiem-dinh"></div>
      </div>
      <div>
        <div class="sec-t"><span>Lịch sử</span><span>30</span></div>
        <div class="scroll mono" id="md5-lich-su"></div>
      </div>
    </div>
  </div>

  <footer class="mono">HELIX · ANH KHÔI</footer>
</div>

<script>
const $=id=>document.getElementById(id);
let keyHienTai=localStorage.getItem("helix_key")||"";
let logoHienTai=localStorage.getItem("helix_logo_base64")||"";
let boDem=null;

function apDungLogo(b64){
  const img=$("logo-img"),def=$("logo-default");
  if(!b64?.trim()){img.style.display="none";def.style.display="flex";return}
  let src=b64.trim();
  if(!src.startsWith("data:image"))src="data:image/png;base64,"+src;
  img.src=src;
  img.onload=()=>{img.style.display="block";def.style.display="none"};
  img.onerror=()=>{img.style.display="none";def.style.display="flex"};
}

if(logoHienTai){$("logo-base64").value=logoHienTai;apDungLogo(logoHienTai)}
$("logo-base64").addEventListener("input",e=>{
  const v=e.target.value.trim();
  localStorage.setItem("helix_logo_base64",v);
  apDungLogo(v);
});
if(keyHienTai)$("key").value=keyHienTai;

function hienThi(kenh,d){
  if(!d)return;
  const p=d.prediction,l=d.last;
  if(p){
    const el=$(`${kenh}-du-doan`);
    el.textContent=p.pred.toUpperCase();
    el.className=`pred ${p.pred==="tài"?"tai":"xiu"}`;
    $(`${kenh}-phien-tiep`).textContent=p.session;
    $(`${kenh}-tin-cay`).textContent=p.conf;
    $(`${kenh}-thuat-toan`).textContent=p.src||"—";
    const bao=$(`${kenh}-co-bao`);
    if(p.reverse||p.cheat){bao.style.display="inline-block";bao.textContent=p.reverse?"ĐẢO":"BẺ"}
    else bao.style.display="none";
  }
  if(l){
    $(`${kenh}-phien-truoc`).textContent=l.session;
    $(`${kenh}-xuc-xac`).textContent=l.dice.join("-");
    $(`${kenh}-tong-diem`).textContent=`${l.total} ${l.result.toUpperCase()}`;
  }
  $(`${kenh}-ti-le`).textContent=d.acc20||"0%";

  const kd=$(`${kenh}-kiem-dinh`);
  kd.innerHTML=(d.outcomes||[]).map(o=>`
    <div class="row">
      <span class="${o.ok?"ok":"ng"}">${o.ok?"Đ":"S"}</span>
      <span>#${o.session}</span>
      <span style="margin:0 8px;font-weight:700">${o.pred.toUpperCase()}→${o.actual.toUpperCase()}</span>
      <span style="color:var(--muted);margin-left:auto;font-size:.68rem">${o.src||""}</span>
    </div>`).join("")||'<div class="row" style="color:var(--muted)">Trống</div>';

  const ls=$(`${kenh}-lich-su`);
  ls.innerHTML=(d.history||[]).map(h=>`
    <div class="row">
      <span class="dot ${h.tx}"></span>
      <span>#${h.s}</span>
      <span style="margin-left:10px;color:var(--muted)">[${h.d.join("-")}]</span>
      <span style="margin-left:auto;font-weight:700">${h.t} ${h.r.toUpperCase()}</span>
    </div>`).join("")||"";
}

const cache=localStorage.getItem("helix_cache_dashboard");
if(cache){
  try{
    const p=JSON.parse(cache);
    $("khu-vuc-lam-viec").style.display="grid";
    hienThi("hu",p.hu);hienThi("md5",p.md5);
  }catch{}
}

async function dongBo(){
  keyHienTai=$("key").value.trim();
  const hop=$("hop-loi");
  if(!keyHienTai){hop.textContent="Nhập key";hop.style.display="block";return}
  localStorage.setItem("helix_key",keyHienTai);
  try{
    const res=await fetch(`/api/dashboard?key=${encodeURIComponent(keyHienTai)}`);
    const data=await res.json();
    if(!res.ok){
      hop.textContent=data.error||"Key sai";
      hop.style.display="block";
      if(!cache)$("khu-vuc-lam-viec").style.display="none";
      return;
    }
    hop.style.display="none";
    $("khu-vuc-lam-viec").style.display="grid";
    localStorage.setItem("helix_cache_dashboard",JSON.stringify(data));
    hienThi("hu",data.hu);hienThi("md5",data.md5);
  }catch{
    if(!cache){hop.textContent="Đang kết nối...";hop.style.display="block"}
  }
}

$("btn-ketnoi").onclick=()=>{
  dongBo();
  if(boDem)clearInterval(boDem);
  boDem=setInterval(dongBo,4000);
};
if(keyHienTai){dongBo();boDem=setInterval(dongBo,4000)}
</script>
</body>
</html>
